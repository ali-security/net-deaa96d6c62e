# Upstream golang.org/x/net has no GitHub Actions CI: the project is developed
# on Gerrit (go.googlesource.com/net) and tested on the Go project's own
# TryBot/LUCI builders, so this workflow is written from scratch. It reproduces
# the module source zip exactly as the module proxy publishes it, and runs the
# project's own suite (`go build ./...` / `go test ./...`) on Linux, macOS and
# Windows -- the platforms the Go builders cover for this repository.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Space-separated top-level Go test names to run instead of the full suite.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  module-zip:
    name: Module zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # go.mod declares `go 1.24.0`, so 1.24 is the toolchain this release
      # targets.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      # The helper lives in its own module OUTSIDE the checkout so that
      # `go get` never touches this repository's go.mod/go.sum and the helper
      # source can never be swept into the module zip.
      - name: Build module-zip helper
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/helper"
          cat > "$RUNNER_TEMP/helper/main.go" <<'EOF'
          // Indented with spaces, not tabs: a tab preceded by the YAML block
          // scalar's own indentation is "space before tab in indent", which the
          // version patch round-trip normalizes away and would break this
          // block. go build does not care.
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              if len(os.Args) != 5 {
                  log.Fatal("usage: create_mod <module-path> <version> <source-dir> <output-zip>")
              }
              m := module.Version{Path: os.Args[1], Version: os.Args[2]}
              f, err := os.Create(os.Args[4])
              if err != nil {
                  log.Fatal(err)
              }
              if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
                  log.Fatal(err)
              }
              if err := f.Close(); err != nil {
                  log.Fatal(err)
              }
              log.Printf("created module zip: %s", os.Args[4])
          }
          EOF
          cd "$RUNNER_TEMP/helper"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" .

      # zip.CreateFromDir applies the module proxy's own inclusion rules, so it
      # already drops .git/ and nested modules -- but it DESCENDS into .github,
      # which the published zip has no entry for. Removing it here keeps the
      # file set identical to the proxy artifact. .gitignore, .gitattributes and
      # codereview.cfg stay: they ARE part of the published module zip.
      - name: Create module zip
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" \
            golang.org/x/net v0.45.0 \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/out/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.45.0.zip" | tail -5

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.45.0.zip
          if-no-files-found: error

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # Windows would otherwise default to pwsh, where `set -euxo pipefail`
        # is not valid.
        shell: bash
    env:
      # On the 1.24 toolchain the http2 tests are gated behind
      # `go1.25 || goexperiment.synctest` and the internal/http3 tests behind
      # `go1.24 && goexperiment.synctest`. Without the experiment those files
      # are dropped from the build and the packages test almost nothing, so the
      # experiment is what makes the real suite run on this toolchain.
      GOEXPERIMENT: synctest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: |
          set -euxo pipefail
          go mod download

      - name: Build
        run: |
          set -euxo pipefail
          go build ./...

      # An empty test-filter runs the whole suite. A non-empty one runs only the
      # named top-level tests, and every name must show its own `=== RUN` line:
      # `go test -run` exits 0 when a pattern matches nothing, so the grep loop
      # is what makes a vanished test fail the job instead of passing vacuously.
      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -euxo pipefail
          if [ -n "$TEST_FILTER" ]; then
            go test -v -run "^($(echo "$TEST_FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee "$RUNNER_TEMP/scoped.log"
            for t in $TEST_FILTER; do
              grep -qE "^=== RUN[[:space:]]+${t}(/|\$)" "$RUNNER_TEMP/scoped.log" \
                || { echo "selected test $t never ran"; exit 1; }
            done
          else
            go test ./...
          fi
